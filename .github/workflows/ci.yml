name: CI

on:
  push:
    branches:
      - master
    tags:
      - "*"
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: ./workspace
      - name: Install and run Luacheck
        uses: BigWigsMods/luacheck@main
        with:
          args: "--no-color -q"
          config: https://raw.githubusercontent.com/DeadlyBossMods/DBM-Retail/refs/heads/master/.luacheckrc
          path: ./workspace

      - name: LuaLS check
        uses: DeadlyBossMods/LuaLS-config@main
        with:
          luals-check-dir: ${{ github.workspace }}/workspace

      - name: Send Status to Discord
        uses: nebularg/actions-discord-webhook@v1
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
        if: ${{ failure() }}

  test-package:
    name: Test Package
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    needs:
      - test
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create test package
        uses: BigWigsMods/packager@master
        with:
          args: -d
          pandoc: false
      - name: Stage test packages
        shell: bash
        run: |
          mkdir -p artifacts
          cp .release/*.zip artifacts/
      - name: Upload test packages
        id: upload-test-packages
        uses: actions/upload-artifact@v7
        with:
          name: DBM-Retail-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Link test package on pull request
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v8
        env:
          ARTIFACT_URL: ${{ steps.upload-test-packages.outputs.artifact-url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- dbm-retail-test-package -->';
            const body = [
              marker,
              '## DBM-Retail test package',
              '',
              `[Download the packaged test ZIPs](${process.env.ARTIFACT_URL})`,
              '',
              'This artifact includes packager-fetched dependencies and substitutions. It expires after 14 days.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existingComment = comments.find((comment) => comment.body.includes(marker));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  deploy:
    name: Deployment
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - test
    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Create Package
        uses: BigWigsMods/packager@master
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
